name: Build MAL Contributions

on:
  # The primary trigger is the external cron-job (every 6 hours, calling workflow_dispatch).
  # This schedule is only a low-frequency backup in case that cron-job stops. GitHub may delay or
  # skip scheduled runs, and disables them after 60 days without repository activity, so it must
  # not be the only trigger. Twice a day (UTC 05:17 and 17:17) keeps MAL requests low.
  schedule:
    - cron: '17 5,17 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'data/state.json'
      - 'site/**'
      - 'README.md'
      - '.gitignore'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: mal-heatmap-pages
  cancel-in-progress: false

jobs:
  collect-build-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # The token is NOT left in .git/config while third-party code (Toki) is built and run.
          # It is added back only in the "Commit updated tracker state" step.
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Run JavaScript tests
        run: npm test

      # Toki provides the public MAL Recent History endpoint that official MAL API v2 does not expose.
      # The Go binary is built and run only inside this temporary Actions runner.
      # Pin Toki to a reviewed commit: set the repository variable TOKI_COMMIT
      # (Settings -> Secrets and variables -> Actions -> Variables) to a full 40-character SHA.
      # Without it the run still works but prints a warning with the SHA it used, so you can pin it.
      - name: Download Toki history adapter
        env:
          TOKI_COMMIT: ${{ vars.TOKI_COMMIT }}
        run: |
          set -euo pipefail
          TOKI_DIR="$RUNNER_TEMP/toki"
          if [ -n "${TOKI_COMMIT:-}" ]; then
            if ! printf '%s' "$TOKI_COMMIT" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "::error::TOKI_COMMIT must be a full 40-character lowercase commit SHA."
              exit 1
            fi
            git init -q "$TOKI_DIR"
            git -C "$TOKI_DIR" remote add origin https://github.com/nyawave/toki.git
            git -C "$TOKI_DIR" fetch --depth 1 origin "$TOKI_COMMIT"
            git -C "$TOKI_DIR" checkout -q FETCH_HEAD
          else
            git clone --depth 1 https://github.com/nyawave/toki.git "$TOKI_DIR"
          fi
          USED_SHA="$(git -C "$TOKI_DIR" rev-parse HEAD)"
          echo "Toki commit in use: $USED_SHA"
          if [ -z "${TOKI_COMMIT:-}" ]; then
            echo "::warning::Toki is not pinned (it follows upstream's latest code). Set repository variable TOKI_COMMIT=$USED_SHA after reviewing it."
          fi

      # MAL shows history times in Pacific time, but upstream Toki parses them as UTC. That shifts
      # dates and makes "Today"/"Yesterday" resolve against the wrong day. Parse them as Pacific time
      # (the same helper Toki already uses for "Last Online"). Fails loudly if upstream changes.
      - name: Patch Toki to read history times as MAL (Pacific) time
        working-directory: ${{ runner.temp }}/toki
        run: |
          sed -i 's/history\.Date = helper\.ParseDate(date)/history.Date = helper.ParseDateTimePST(date)/' internal/parser/user.go
          grep -q 'history.Date = helper.ParseDateTimePST(date)' internal/parser/user.go

      - name: Set up Go for Toki
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
          cache: false

      - name: Build Toki
        working-directory: ${{ runner.temp }}/toki
        run: go build -trimpath -o "$RUNNER_TEMP/toki-server" ./cmd/toki

      - name: Start temporary Toki server
        run: |
          # env -i: the third-party server gets an empty environment, so it cannot read the job's
          # token variables (e.g. the OIDC request token that "id-token: write" adds).
          env -i PATH="$PATH" HOME="$RUNNER_TEMP" HOST=127.0.0.1 PORT=3000 \
            "$RUNNER_TEMP/toki-server" > "$RUNNER_TEMP/toki.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              echo "Toki is ready."
              exit 0
            fi
            sleep 1
          done
          echo "Toki failed to start. Server log:"
          cat "$RUNNER_TEMP/toki.log"
          exit 1

      - name: Backfill recent MAL history, update calendar, and render site
        env:
          MAL_USERNAME: TiMEZ4I3eth
          TOKI_BASE_URL: http://127.0.0.1:3000
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npm run build

      - name: Commit updated tracker state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Credentials were not persisted at checkout; give git the token only for this step.
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          if git diff --cached --quiet; then
            echo "No tracker state changes to commit."
            exit 0
          fi
          git commit -m "chore: update MAL contribution history [skip ci]"
          # main may have moved since checkout (e.g. you pushed code while this run was busy).
          # Rebase onto it and retry instead of failing the whole run.
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "Pushed tracker state (attempt $attempt)."
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying in $((attempt * 5))s."
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo "::error::Could not push data/state.json after 3 attempts."
          exit 1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
